spring:
  application:
    name: server_me
  config:
    import: optional:file:.env[.properties]
  profiles:
    # Chạy trên máy mặc định dùng local. Render phải đặt SPRING_PROFILES_ACTIVE=cloud.
    active: ${SPRING_PROFILES_ACTIVE:local}

  ai:
    openai:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      api-key: ${AI_KEY:}
      chat:
        model: gemini-flash-lite-latest
        temperature: 0.3

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        # Hibernate tự nhận MySQL ở local và PostgreSQL trên Supabase.

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  # Render tự cấp PORT; local tiếp tục dùng 8080.
  port: ${PORT:8080}

jwt:
  secretKey: ${JWT_SECRET_KEY}
  accessExpiration: 86400000
  refreshExpiration: 604800000

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
