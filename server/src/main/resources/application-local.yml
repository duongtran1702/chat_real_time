spring:
  datasource:
    # Chỉ dùng khi chạy ServerApplication trên máy cá nhân.
    url: jdbc:mysql://localhost:3306/server_test_ai_db?createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASS}
  ai:
    chat:
      memory:
        repository:
          jdbc:
            # Local dùng InMemory ChatMemory → không cần tạo bảng JDBC.
            initialize-schema: never

app:
  auth:
    cookie:
      secure: false
      same-site: Lax
  frontend:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
