spring:
  datasource:
    # Railway cung cấp ba biến này; production không dùng localhost.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  auth:
    cookie:
      # Domain production chạy HTTPS nên refresh cookie bắt buộc Secure.
      secure: true
      same-site: Lax
  frontend:
    allowed-origins:
      - https://chat.atmin.io.vn
