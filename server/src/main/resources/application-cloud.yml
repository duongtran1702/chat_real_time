spring:
  datasource:
    # Render nhận ba biến kết nối từ Supabase; production không dùng localhost.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Supabase Free giới hạn kết nối; giữ pool nhỏ cho ứng dụng chat demo.
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 30000

server:
  # Render Free chỉ có 512 MB RAM; giới hạn pool request cho ứng dụng chat nhỏ.
  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 100

app:
  auth:
    cookie:
      # Domain production chạy HTTPS nên refresh cookie bắt buộc Secure.
      secure: true
      same-site: Lax
  frontend:
    allowed-origins:
      - https://chat.atmin.io.vn
      - https://chat-real-time-uhjj.onrender.com
